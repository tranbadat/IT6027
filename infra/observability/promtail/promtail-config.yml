# Promtail: gom log stdout của MỌI container (qua Docker API) rồi đẩy vào Loki.
# Gắn nhãn theo compose service/project để xem log tập trung theo từng service.
server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project
    pipeline_stages:
      # Log các service Python là JSON {ts, level, service, msg,...} -> tách level để lọc.
      - json:
          expressions:
            level: level
      - labels:
          level:
