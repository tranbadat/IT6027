# Nginx dùng cho môi trường dev/demo. Định dạng log "waf" = combined + 2 trường mở rộng cho C2/C3.
log_format waf '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
               '"$http_referer" "$http_user_agent" rt=$request_time ck="$cookie_PHPSESSID"';

server {
    listen 80;
    server_name shop.example.com localhost;
    access_log /var/log/nginx/waf-access.log waf;

    location / {
        return 200 "hello from shop.example.com\n";
        add_header Content-Type text/plain;
    }
}
