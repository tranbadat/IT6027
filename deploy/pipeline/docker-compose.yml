# LOẠI 2 — Pipeline xử lý (Người 1 phần chuẩn hoá + Người 2 phát hiện).
# C2 chuẩn hoá -> C3 enrichment -> detector (Java: khớp rule + chấm điểm). rule-api quản lý rule.
# Kết nối tới Kafka và Scope Service của stack Platform qua network waf-net.
#
# Chạy sau khi Platform đã lên:
#        cp .env.example .env
#        docker compose up -d            (thêm --profile ddos để bật nhánh phát hiện DDoS)
name: waf-pipeline

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

# Không phụ thuộc DB. Backbone (Kafka, scope) nằm ở stack Platform -> chỉ cần địa chỉ.
x-svc-env: &svc-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  EVENT_BUS_URL: ${EVENT_BUS_URL:-kafka:19092}
  SCOPE_SERVICE_URL: ${SCOPE_SERVICE_URL:-http://p1-scope:8000}
  HTTP_PORT: "8000"

x-svc: &svc
  restart: unless-stopped
  logging: *logging
  networks: [waf-net]

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD-SHELL", "python -c \"import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/alive')<30 else 1)\""]
  interval: 10s
  timeout: 3s
  retries: 3

x-detector-env: &detector-env
  KAFKA_BOOTSTRAP_SERVERS: ${EVENT_BUS_URL:-kafka:19092}
  SCOPE_SERVICE_URL: ${SCOPE_SERVICE_URL:-http://p1-scope:8000}
  ALERT_SCORE_THRESHOLD: ${ALERT_SCORE_THRESHOLD:-70}
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"

x-detector: &detector
  image: waf/detector:dev
  restart: unless-stopped
  logging: *logging
  networks: [waf-net]
  environment: *detector-env

services:
  c2-parser:
    <<: *svc
    image: waf/c2-parser:dev
    environment: *svc-env
    healthcheck: *worker-healthcheck

  c3-enrichment:
    <<: *svc
    image: waf/c3-enrichment:dev
    environment:
      <<: *svc-env
      GEOIP_DB_PATH: /data/geoip/dbip-city-lite.mmdb
    volumes:
      - ../../data/geoip:/data/geoip:ro
    healthcheck: *worker-healthcheck

  # Detector Java (services/detector): log.enriched -> attack.detected / anomaly.scored / alert.triggered.
  detector:
    <<: *detector
    command: ["java", "-jar", "/app/app.jar", "detection"]

  # Quản lý rule (CRUD + kiểm tra RE2). Không publish cổng: chỉ truy cập qua gateway (JWT).
  rule-api:
    <<: *detector
    command: ["java", "-jar", "/app/app.jar", "rule-management"]
    environment:
      <<: *detector-env
      RULE_API_PORT: "8090"
      RULE_STORE_PATH: /data/rules.json
    volumes:
      - rules-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  # Nhánh DDoS (profile ddos): phân vùng lại theo domain rồi đếm request + số IP theo cửa sổ.
  repartitioner:
    <<: *detector
    profiles: [ddos]
    command: ["java", "-jar", "/app/app.jar", "repartition"]

  ddos-detector:
    <<: *detector
    profiles: [ddos]
    command: ["java", "-jar", "/app/app.jar", "ddos"]

networks:
  waf-net:
    external: true
    name: waf-net

volumes:
  rules-data:
