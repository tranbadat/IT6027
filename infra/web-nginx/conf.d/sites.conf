# Web server mục tiêu mà analyzer giám sát.
# Mỗi vhost ghi log ra file riêng tên <domain>.access.log để C1 suy ra domain từ tên file
# (không tin header Host vì client tự đặt được).
#
# Định dạng = combined + các trường mở rộng ở cuối (parser combined vẫn khớp phần đầu):
#   "$host"  rt=<request_time giây>  sid="<cookie sessionid>"
log_format waf_combined '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                        '"$host" rt=$request_time sid="$cookie_sessionid"';

# Chỉ bỏ qua healthcheck nội bộ của container (theo IP, không theo path,
# để request tấn công dạng /healthz?<payload> từ bên ngoài vẫn được ghi log).
map $remote_addr $waf_loggable {
    127.0.0.1 0;
    default   1;
}

server_tokens off;

# shop.local — domain nằm trong scope (có trong allowlist của mock-api)
server {
    listen 80 default_server;
    server_name shop.local localhost;

    access_log /var/log/waf/nginx/shop.local.access.log waf_combined if=$waf_loggable;
    access_log /dev/stdout waf_combined if=$waf_loggable;
    error_log  /var/log/waf/nginx/shop.local.error.log warn;

    root /usr/share/nginx/html/shop;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Giả lập backend ứng dụng: mọi request /api/* đều "tới được" app và trả 200.
    location /api/ {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# internal.local — domain KHÔNG nằm trong scope: dùng để kiểm thử service bỏ qua log ngoài phạm vi.
server {
    listen 80;
    server_name internal.local;

    access_log /var/log/waf/nginx/internal.local.access.log waf_combined if=$waf_loggable;
    error_log  /var/log/waf/nginx/internal.local.error.log warn;

    location / {
        default_type application/json;
        return 200 '{"service":"internal"}';
    }
}

# lab.local — domain THÍ NGHIỆM (experiments/). Tin X-Forwarded-For từ dải mạng nội bộ để giả lập
# nhiều IP nguồn khi sinh lưu lượng trên một máy. KHÔNG dùng cấu hình này cho site thật.
server {
    listen 80;
    server_name lab.local;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    access_log /var/log/waf/nginx/lab.local.access.log waf_combined if=$waf_loggable;
    error_log  /var/log/waf/nginx/lab.local.error.log warn;

    root /usr/share/nginx/html/lab;

    location /api/ {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Trang nội dung ảo (sản phẩm, danh mục, bài viết): luôn tồn tại.
    location ~ ^/(p|c|blog)/ {
        default_type text/html;
        return 200 '<!doctype html><title>lab</title><link rel="stylesheet" href="/assets/app.css"><script src="/assets/app.js"></script>';
    }

    location = /search {
        default_type text/html;
        return 200 '<!doctype html><title>search</title>';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
