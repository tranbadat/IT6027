# (TUỲ CHỌN) Thêm vào cấu hình Nginx CỦA APP để log giàu thông tin hơn cho analyzer:
# domain ($host), thời gian xử lý (rt), và session id từ cookie (sid).
# KHÔNG bắt buộc — sensor vẫn parse được log "combined" chuẩn nếu bỏ qua file này.
#
# Cách dùng:
#   1) Đặt block log_format này trong khối http{} của Nginx (thường /etc/nginx/nginx.conf).
#   2) Trong server{} của app, trỏ access_log dùng format "waf_combined".
#   3) nginx -t && nginx -s reload
#   4) Trỏ sensor vào thư mục log này (SENSOR_NGINX_LOG_DIR) và đặt C1_DOMAIN nếu file là access.log.

log_format waf_combined '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                        '"$host" rt=$request_time sid="$cookie_sessionid"';

# Ví dụ trong server{}:
#   access_log /var/log/nginx/myapp.access.log waf_combined;
#
# Nếu muốn C1 tự suy domain từ tên file, đặt tên file theo dạng <domain>.access.log
# (vd myapp.com.access.log); khi đó không cần C1_DOMAIN.
