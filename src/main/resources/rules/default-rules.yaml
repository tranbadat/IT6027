schemaVersion: 1
rules:
  - {id: SQLI_UNION_SELECT, group: SQLi, description: UNION SELECT injection, enabled: true, targets: [url, query, body, headers], pattern: 'union[ ]+(?:all[ ]+)?select', score: 85, normalizers: [url_decode, html_decode, sql_canonical]}
  - {id: SQLI_TIME_FUNCTION, group: SQLi, description: Time based SQL injection, enabled: true, targets: [query, body, headers], pattern: '(?:sleep|benchmark|pg_sleep)[ ]*[(]', score: 85, normalizers: [url_decode, html_decode, sql_canonical]}
  - {id: SQLI_BOOLEAN, group: SQLi, description: Boolean SQL injection, enabled: true, targets: [query, body], pattern: '(?:or|and)[ ]+(?:[0-9]+|''[^'']{0,32}'')[ ]*=[ ]*(?:[0-9]+|''[^'']{0,32}'')', score: 80, normalizers: [url_decode, html_decode, sql_canonical]}
  - {id: XSS_SCRIPT, group: XSS, description: Script element injection, enabled: true, targets: [url, query, body, headers], pattern: '<[ ]*script', score: 90, normalizers: [url_decode, html_decode]}
  - {id: XSS_HANDLER, group: XSS, description: Inline event handler injection, enabled: true, targets: [query, body, headers], pattern: 'on[a-z]{3,32}[ ]*=', score: 85, normalizers: [url_decode, html_decode]}
  - {id: TRAVERSAL_PARENT, group: path_traversal, description: Parent directory traversal, enabled: true, targets: [url, query, body], pattern: '[.][.]/', score: 85, normalizers: [url_decode]}
  - {id: TRAVERSAL_SENSITIVE, group: path_traversal, description: Sensitive operating system path, enabled: true, targets: [url, query, body], pattern: '(?:/etc/(?:passwd|shadow|hosts)|[a-z]:/windows/(?:win[.]ini|system32))', score: 90, normalizers: [url_decode]}
