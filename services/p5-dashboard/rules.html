<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WAF — Quản trị Rule</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: #0f1420; color: #e6e9ef; }
    header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
             padding: 12px 16px; background: #161c2c; border-bottom: 1px solid #263049; }
    header h1 { font-size: 16px; margin: 0; }
    a { color: #6ea8fe; text-decoration: none; }
    .pill { padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #263049; }
    .pill.ok { background: #14432a; color: #7ee2a8; }
    .pill.err { background: #4a1d24; color: #ff9aa8; }
    main { padding: 16px; max-width: 1100px; margin: 0 auto; }
    section { background: #161c2c; border: 1px solid #263049; border-radius: 10px;
              padding: 16px; margin-bottom: 16px; }
    h2 { font-size: 14px; margin: 0 0 12px; }
    label { display: block; font-size: 12px; color: #9aa4bd; margin: 8px 0 2px; }
    input, select, textarea { width: 100%; padding: 7px 9px; background: #0f1420;
      border: 1px solid #2c3852; border-radius: 6px; color: #e6e9ef; font: inherit; }
    textarea { font-family: ui-monospace, Menlo, monospace; min-height: 42px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px 12px; }
    .row-btns { margin-top: 12px; display: flex; gap: 8px; }
    button { padding: 8px 14px; border: 0; border-radius: 6px; cursor: pointer; font: inherit; }
    .primary { background: #2f6fed; color: #fff; }
    .ghost { background: #263049; color: #cdd5e6; }
    .danger { background: #b23241; color: #fff; }
    .msg { margin-top: 10px; padding: 8px 10px; border-radius: 6px; display: none; }
    .msg.show { display: block; }
    .msg.ok { background: #14432a; color: #b7f0cd; }
    .msg.err { background: #4a1d24; color: #ffc2cc; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #232d44; vertical-align: top; }
    th { color: #9aa4bd; font-weight: 600; font-size: 12px; }
    code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #ffd9a0; word-break: break-all; }
    .tag { padding: 1px 7px; border-radius: 999px; font-size: 11px; background: #263049; }
    .sev-high, .sev-critical { background: #4a1d24; color: #ff9aa8; }
    .sev-medium { background: #4a3a1d; color: #ffd38a; }
    .sev-low { background: #1d3a4a; color: #8ad0ff; }
    .actions button { padding: 4px 10px; font-size: 12px; }
    .empty { color: #7a839c; }
    .err { color: #ff9aa8; }
  </style>
</head>
<body>
  <header>
    <h1>WAF — Quản trị Rule</h1>
    <a href="/">← Dashboard realtime</a>
    <span style="flex:1"></span>
    <span id="auth-status" class="pill">auth: …</span>
    <span id="count" class="pill">rule: …</span>
  </header>

  <main>
    <section>
      <h2 id="form-title">Thêm rule mới</h2>
      <form id="rule-form" autocomplete="off">
        <div class="grid">
          <div><label>ID</label><input id="f-id" placeholder="vd sqli-custom-1" required></div>
          <div><label>Tên</label><input id="f-name" placeholder="Mô tả ngắn" required></div>
          <div><label>Loại tấn công</label>
            <select id="f-attack_type">
              <option>sql_injection</option><option>xss</option><option>path_traversal</option>
              <option>command_injection</option><option>lfi</option><option>rfi</option>
              <option>sensitive_file</option><option>log4shell</option><option>ssti</option><option>scanner</option>
            </select></div>
          <div><label>Mức độ</label>
            <select id="f-severity"><option>low</option><option selected>medium</option><option>high</option><option>critical</option></select></div>
          <div><label>Trường khớp (target)</label>
            <select id="f-target">
              <option>any</option><option>path_decoded</option><option>query_decoded</option>
              <option>path</option><option>query_string</option><option>user_agent</option>
              <option>referer</option><option>url_decoded</option>
            </select></div>
        </div>
        <label>Pattern (regex Python)</label>
        <textarea id="f-pattern" placeholder="(?i)union\s+select" required></textarea>
        <label>Mô tả</label>
        <input id="f-description" placeholder="Giải thích rule (tuỳ chọn)">
        <div class="row-btns">
          <button type="submit" class="primary" id="submit-btn">Lưu rule</button>
          <button type="button" class="ghost" id="validate-btn">Chỉ kiểm tra</button>
          <button type="button" class="ghost" id="reset-btn" hidden>Huỷ sửa</button>
        </div>
        <div id="msg" class="msg"></div>
      </form>
    </section>

    <section>
      <h2>Danh sách rule</h2>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>ID</th><th>Tên</th><th>Loại</th><th>Mức</th><th>Target</th><th>Pattern</th><th></th></tr></thead>
          <tbody id="rules-body"><tr><td colspan="7" class="empty">Đang tải…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let editing = null; // id đang sửa, null = thêm mới

    function setPill(id, text, cls) { const el = $(id); el.textContent = text; el.className = "pill" + (cls ? " " + cls : ""); }
    function esc(v) { return String(v == null ? "" : v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function showMsg(text, ok) { const m = $("msg"); m.textContent = text; m.className = "msg show " + (ok ? "ok" : "err"); }
    function hideMsg() { $("msg").className = "msg"; }

    async function api(path, opts = {}) {
      return fetch(path, { credentials: "include", headers: { "content-type": "application/json" }, ...opts });
    }

    async function getToken() {
      try {
        const r = await api("/api/auth/token", { method: "POST",
          body: '{"client_id":"admin","client_secret":"admin"}' });
        if (!r.ok) throw new Error("HTTP " + r.status);
        setPill("auth-status", "auth: ok", "ok");
        return true;
      } catch (e) { setPill("auth-status", "auth: lỗi", "err"); return false; }
    }

    function formData() {
      return {
        id: $("f-id").value.trim(), name: $("f-name").value.trim(),
        attack_type: $("f-attack_type").value, severity: $("f-severity").value,
        target: $("f-target").value, pattern: $("f-pattern").value,
        description: $("f-description").value.trim(),
      };
    }

    function fillForm(r) {
      $("f-id").value = r.id; $("f-name").value = r.name || "";
      $("f-attack_type").value = r.attack_type; $("f-severity").value = r.severity;
      $("f-target").value = r.target; $("f-pattern").value = r.pattern;
      $("f-description").value = r.description || "";
    }

    function resetForm() {
      editing = null; $("rule-form").reset(); $("f-id").readOnly = false;
      $("form-title").textContent = "Thêm rule mới"; $("submit-btn").textContent = "Lưu rule";
      $("reset-btn").hidden = true; hideMsg();
    }

    function startEdit(r) {
      editing = r.id; fillForm(r); $("f-id").readOnly = true;
      $("form-title").textContent = "Sửa rule: " + r.id; $("submit-btn").textContent = "Cập nhật";
      $("reset-btn").hidden = false; hideMsg();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function loadRules() {
      const r = await api("/api/rules/");
      if (!r.ok) { $("rules-body").innerHTML = '<tr><td colspan="7" class="err">Không tải được (' + r.status + ')</td></tr>'; return; }
      const data = await r.json();
      const items = data.items || [];
      setPill("count", "rule: " + items.length);
      if (!items.length) { $("rules-body").innerHTML = '<tr><td colspan="7" class="empty">Chưa có rule.</td></tr>'; return; }
      $("rules-body").innerHTML = items.map((r) =>
        "<tr><td><code>" + esc(r.id) + "</code></td><td>" + esc(r.name) + "</td>"
        + '<td><span class="tag">' + esc(r.attack_type) + "</span></td>"
        + '<td><span class="tag sev-' + esc(r.severity) + '">' + esc(r.severity) + "</span></td>"
        + "<td>" + esc(r.target) + "</td><td><code>" + esc(r.pattern) + "</code></td>"
        + '<td class="actions"><button class="ghost" data-edit="' + esc(r.id) + '">Sửa</button> '
        + '<button class="danger" data-del="' + esc(r.id) + '">Xoá</button></td></tr>'
      ).join("");
      window._rules = Object.fromEntries(items.map((r) => [r.id, r]));
    }

    function errText(body) {
      if (!body) return "Lỗi không rõ";
      if (Array.isArray(body.errors) && body.errors.length) return body.errors.join("; ");
      return body.message || "Lỗi";
    }

    async function submitForm(validateOnly) {
      hideMsg();
      const rule = formData();
      let path = "/api/rules/", method = "POST";
      if (validateOnly) path = "/api/rules/validate";
      else if (editing) { path = "/api/rules/" + encodeURIComponent(editing); method = "PUT"; }
      const r = await api(path, { method, body: JSON.stringify(rule) });
      const body = await r.json().catch(() => null);
      if (r.ok) {
        showMsg(validateOnly ? "Rule hợp lệ ✓" : (editing ? "Đã cập nhật ✓ (D1 nạp lại trong ~5s)" : "Đã thêm ✓ (D1 nạp lại trong ~5s)"), true);
        if (!validateOnly) { resetForm(); loadRules(); }
      } else {
        showMsg("Không lưu được (" + r.status + "): " + errText(body), false);
      }
    }

    document.addEventListener("click", async (ev) => {
      const editId = ev.target.getAttribute && ev.target.getAttribute("data-edit");
      const delId = ev.target.getAttribute && ev.target.getAttribute("data-del");
      if (editId && window._rules) startEdit(window._rules[editId]);
      if (delId) {
        if (!confirm("Xoá rule '" + delId + "'?")) return;
        const r = await api("/api/rules/" + encodeURIComponent(delId), { method: "DELETE" });
        if (r.ok) { showMsg("Đã xoá '" + delId + "' ✓", true); loadRules(); }
        else showMsg("Xoá thất bại (" + r.status + ")", false);
      }
    });

    $("rule-form").addEventListener("submit", (e) => { e.preventDefault(); submitForm(false); });
    $("validate-btn").addEventListener("click", () => submitForm(true));
    $("reset-btn").addEventListener("click", resetForm);

    (async function init() { await getToken(); await loadRules(); })();
  </script>
</body>
</html>
