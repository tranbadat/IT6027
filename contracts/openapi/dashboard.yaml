openapi: 3.1.0
info:
  title: P5 Dashboard
  version: 0.3.0
  description: |
    API tổng hợp cho bảng điều khiển thời gian thực. P5 đọc các topic `log.enriched`, `attack.detected`,
    `anomaly.scored`, `alert.triggered`, `stage.completed` (consumer group `p5-dashboard`), giữ số liệu
    tổng hợp trong bộ nhớ, lưu lịch sử tấn công vào Postgres (`detection.attacks`, idempotent theo
    `event_id`) và đẩy sự kiện realtime qua Server-Sent Events.

    - API dữ liệu: qua gateway `http://localhost:8080/api/dashboard/...` (cần JWT). Gateway chặn
      đường tắt `/dashboard/...` không qua `/api`.
    - Giao diện SPA (không thuộc API, không cần JWT; trang tự xin token): `http://localhost:8080/`;
      `/rules` chuyển hướng 307 tới view quản lý rule `/#rules`; tài nguyên tĩnh (CSS, JS, icon) ở `/static/...`.
    - Các API thống kê (`/dashboard/overview`, `/dashboard/stats/*`) và lịch sử (`/dashboard/attacks`) đọc
      `detection.attacks`; cửa sổ thời gian là `hours` giờ gần nhất, kỳ trước là `hours` giờ liền trước đó.
  license:
    name: Internal
    identifier: LicenseRef-Internal
servers:
  - url: http://localhost:8080/api
    description: Qua API gateway (JWT)
  - url: http://p5-dashboard:8000
    description: Nội bộ network
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: dashboard
    description: Số liệu tổng hợp, lịch sử, luồng realtime
paths:
  /dashboard/summary:
    get:
      tags: [dashboard]
      operationId: getSummary
      summary: Số liệu tổng hợp trong bộ nhớ (từ khi service khởi động)
      responses:
        '200':
          description: Lưu lượng theo domain và phút, top loại tấn công, top IP, cảnh báo, stage, sự kiện gần nhất.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dashboard/attacks:
    get:
      tags: [dashboard]
      operationId: listAttacks
      summary: Lịch sử tấn công đã lưu trong Postgres (mới nhất trước), có lọc và phân trang
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
        - name: hours
          in: query
          required: false
          description: Chỉ lấy tấn công trong `hours` giờ gần nhất. Bỏ trống thì không giới hạn thời gian.
          schema:
            type: integer
            minimum: 1
            maximum: 720
        - name: q
          in: query
          required: false
          description: Tìm chuỗi con (không phân biệt hoa thường) trong IP nguồn, URL, mã rule, domain. `%` và `_` là ký tự thường.
          schema:
            type: string
            maxLength: 200
          example: 10.0.0.2
        - name: domain
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          example: shop.local
        - name: attack_type
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          example: sql_injection
        - name: severity
          in: query
          required: false
          description: Khớp chính xác; giá trị dùng trong hệ thống là `critical`, `high`, `medium`, `low`.
          schema:
            type: string
            maxLength: 200
        - name: histogram
          in: query
          required: false
          description: true (kèm `hours`) thì trả thêm `histogram` - số tấn công khớp bộ lọc theo từng khoảng thời gian.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Danh sách tấn công. Khi DB không dùng được, `attacks` rỗng và `persisted` = false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttacksResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Tham số sai (ví dụ limit ngoài khoảng 1–1000, q dài hơn 200 ký tự).
  /dashboard/overview:
    get:
      tags: [dashboard]
      operationId: getOverview
      summary: Số liệu màn hình Tổng quan trong cửa sổ thời gian
      description: |
        KPI so với kỳ trước, xu hướng 24 khoảng, diễn biến theo mức độ (48 khoảng), phân loại, top domain,
        top rule, mật độ 7 ngày × 24 giờ (theo `DASHBOARD_TZ`) và top IP nguồn. Không có DB hoặc truy vấn lỗi
        thì chỉ trả `{window: {hours}, persisted: false}`.
      parameters:
        - $ref: '#/components/parameters/Hours'
      responses:
        '200':
          description: Số liệu tổng quan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: hours ngoài khoảng 1–720.
  /dashboard/stats/domains:
    get:
      tags: [dashboard]
      operationId: domainStats
      summary: Số tấn công theo domain trong cửa sổ thời gian
      parameters:
        - $ref: '#/components/parameters/Hours'
      responses:
        '200':
          description: Mọi domain từng bị tấn công, nhiều tấn công nhất trước.
          content:
            application/json:
              schema:
                type: object
                required: [domains, persisted]
                properties:
                  domains:
                    type: array
                    items:
                      type: object
                      required: [domain, count, trend]
                      properties:
                        domain: {type: string}
                        count: {type: integer, description: Số tấn công trong cửa sổ}
                        trend: {$ref: '#/components/schemas/Trend'}
                        last_attack_at:
                          type: [string, 'null']
                          description: Lần bị tấn công gần nhất (mọi thời điểm)
                  persisted: {type: boolean}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: hours ngoài khoảng 1–720.
  /dashboard/stats/rules:
    get:
      tags: [dashboard]
      operationId: ruleStats
      summary: Số lần khớp theo rule trong cửa sổ thời gian
      parameters:
        - $ref: '#/components/parameters/Hours'
      responses:
        '200':
          description: Các rule có khớp trong cửa sổ, nhiều nhất trước.
          content:
            application/json:
              schema:
                type: object
                required: [rules, persisted]
                properties:
                  rules:
                    type: array
                    items:
                      type: object
                      required: [rule_id, count, trend]
                      properties:
                        rule_id: {type: string}
                        count: {type: integer}
                        trend: {$ref: '#/components/schemas/Trend'}
                  persisted: {type: boolean}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: hours ngoài khoảng 1–720.
  /dashboard/stream:
    get:
      tags: [dashboard]
      operationId: streamEvents
      summary: Luồng sự kiện realtime (Server-Sent Events)
      description: |
        Mỗi sự kiện SSE có tên (`event:`) bằng tên event của pipeline: `log.enriched`,
        `attack.detected`, `anomaly.scored`, `alert.triggered`; `data:` là JSON dạng `StreamEvent`.
        Khi không có sự kiện, server gửi dòng chú thích `: keep-alive` mỗi 15 giây.
      responses:
        '200':
          description: Luồng text/event-stream, giữ kết nối mở.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: attack.detected
                data: {"event":"attack.detected","event_id":"9bd80d0e-23c7-47e7-b341-05899669ba4b","request_id":"5f0c2a9e8d1b4c7a","domain":"shop.local","timestamp":"2026-10-14T03:53:33Z","data":{"attack_type":"sql_injection","rule_id":"SQLI_UNION_SELECT","severity":"critical","src_ip":"172.21.0.1","url":"/api/products?id=1%20UNION%20SELECT%20pw"}}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dashboard/links:
    get:
      tags: [dashboard]
      operationId: settingsLinks
      summary: Liên kết hiển thị ở trang Kết nối
      description: |
        Đọc từ biến môi trường `DASHBOARD_LINKS` của P5 (dạng `Tên|URL;Tên|URL`, chỉ nhận URL http/https).
        Danh sách rỗng thì giao diện dùng liên kết mặc định theo hostname và cổng (chạy local).
      responses:
        '200':
          description: Danh sách liên kết, có thể rỗng.
          content:
            application/json:
              schema:
                type: object
                required: [links]
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      required: [name, url]
                      properties:
                        name:
                          type: string
                        url:
                          type: string
                          format: uri
              example:
                links:
                  - name: Mailpit (email cảnh báo)
                    url: https://mail.tranbadat.vn
        '401':
          $ref: '#/components/responses/Unauthorized'
  /healthz:
    servers:
      - url: http://p5-dashboard:8000
        description: Chỉ gọi nội bộ (healthcheck của container)
    get:
      tags: [dashboard]
      operationId: dashboardHealth
      summary: Kiểm tra service còn chạy
      security: []
      responses:
        '200':
          description: Service đang chạy.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: waf_token
  schemas:
    StreamEvent:
      type: object
      required: [event, domain, timestamp, data]
      properties:
        event:
          type: string
          enum: [log.enriched, attack.detected, anomaly.scored, alert.triggered]
        event_id:
          type: [string, 'null']
        request_id:
          type: [string, 'null']
          description: Mã request gốc (null với event không gắn request, ví dụ alert DDoS).
        domain:
          type: string
        timestamp:
          type: string
        data:
          type: object
          description: Phần `data` của envelope gốc (xem contracts/events/README.md).
    AlertBrief:
      type: object
      properties:
        domain: {type: string}
        src_ip: {type: [string, 'null']}
        url: {type: [string, 'null']}
        attack_types:
          type: array
          items: {type: string}
        severity: {type: [string, 'null']}
        score: {type: [number, 'null']}
        threshold: {type: [number, 'null']}
        reason: {type: [string, 'null']}
        triggered_at: {type: [string, 'null']}
    Summary:
      type: object
      required: [traffic, top_attacks, top_ips, alerts, stages, recent]
      properties:
        traffic:
          type: array
          description: Số request theo domain và phút (`YYYY-MM-DDTHH:MM`).
          items:
            type: object
            required: [domain, minute, count]
            properties:
              domain: {type: string}
              minute: {type: string, example: '2026-10-14T03:53'}
              count: {type: integer}
        top_attacks:
          type: array
          items:
            type: object
            required: [attack_type, count]
            properties:
              attack_type: {type: string}
              count: {type: integer}
        top_ips:
          type: array
          items:
            type: object
            required: [ip, count]
            properties:
              ip: {type: string}
              count: {type: integer}
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/AlertBrief'
        stages:
          type: array
          items:
            type: object
            properties:
              pipeline: {type: [string, 'null']}
              stage: {type: [string, 'null']}
              processed: {type: [integer, 'null']}
              window_seconds: {type: [integer, 'null']}
              at: {type: [string, 'null']}
        recent:
          type: array
          items:
            $ref: '#/components/schemas/StreamEvent'
    Attack:
      type: object
      required: [event_id, domain, attack_type]
      properties:
        event_id: {type: string}
        detected_at: {type: [string, 'null']}
        domain: {type: string}
        attack_type: {type: string}
        severity: {type: [string, 'null']}
        rule_id: {type: [string, 'null']}
        rule_name: {type: [string, 'null']}
        src_ip: {type: [string, 'null']}
        method: {type: [string, 'null']}
        url: {type: [string, 'null']}
        host: {type: [string, 'null']}
        field: {type: [string, 'null']}
        matched_value:
          type: [string, 'null']
          description: Đoạn giá trị khớp (tối đa 500 ký tự).
        evidence: {type: [string, 'null']}
        request_id: {type: [string, 'null']}
        session_id: {type: [string, 'null']}
        status: {type: [integer, 'null'], description: Mã HTTP của request bị phát hiện}
        user_agent: {type: [string, 'null']}
        score: {type: [integer, 'null'], description: Điểm (weight) của rule khớp}
    AttacksResponse:
      type: object
      required: [attacks, total, persisted]
      properties:
        attacks:
          type: array
          items:
            $ref: '#/components/schemas/Attack'
        total:
          type: integer
          description: Số tấn công khớp bộ lọc (dùng để phân trang).
        unique_ips:
          type: integer
          description: Số IP nguồn khác nhau trong các tấn công khớp bộ lọc.
        histogram:
          type: object
          description: Chỉ có khi `histogram=true` và có `hours`.
          required: [start, bucket_minutes, buckets]
          properties:
            start: {type: string, description: Đầu cửa sổ (ISO 8601)}
            bucket_minutes: {type: number}
            buckets:
              type: array
              items: {type: integer}
        count:
          type: integer
          description: Tổng số tấn công trong DB, không áp bộ lọc (chỉ có khi persisted = true).
        persisted:
          type: boolean
    Trend:
      type: array
      description: 24 khoảng đều nhau từ đầu tới cuối cửa sổ, cũ trước.
      items: {type: integer}
    Kpi:
      type: object
      properties:
        value: {type: [integer, 'null']}
        previous: {type: [integer, 'null'], description: Giá trị của kỳ trước}
        change_pct: {type: [number, 'null'], description: '% thay đổi so với kỳ trước; null khi kỳ trước bằng 0'}
        trend: {$ref: '#/components/schemas/Trend'}
    Overview:
      type: object
      required: [window, persisted]
      properties:
        window:
          type: object
          properties:
            hours: {type: integer}
            start: {type: string}
            end: {type: string}
            trend_minutes: {type: number, description: Độ dài một khoảng của `trend`}
            timeline_minutes: {type: number, description: Độ dài một khoảng của `timeline`}
        kpi:
          type: object
          properties:
            attacks: {$ref: '#/components/schemas/Kpi'}
            unique_ips: {$ref: '#/components/schemas/Kpi'}
            domains_attacked:
              type: object
              properties:
                trend: {$ref: '#/components/schemas/Trend'}
            rules_matched:
              type: object
              properties:
                trend: {$ref: '#/components/schemas/Trend'}
            alerts:
              allOf:
                - $ref: '#/components/schemas/Kpi'
              description: Từ `alerting.alerts` của P4; bảng chưa tồn tại thì `value` = null.
        timeline:
          type: array
          description: 48 khoảng, mỗi khoảng là số tấn công theo mức độ.
          items:
            type: object
            properties:
              critical: {type: integer}
              high: {type: integer}
              medium: {type: integer}
              low: {type: integer}
        types:
          type: array
          items:
            type: object
            required: [attack_type, count]
            properties:
              attack_type: {type: string}
              count: {type: integer}
        top_domains:
          type: array
          maxItems: 6
          items:
            type: object
            required: [domain, count]
            properties:
              domain: {type: string}
              count: {type: integer}
        top_rules:
          type: array
          maxItems: 6
          items:
            type: object
            required: [rule_id, count]
            properties:
              rule_id: {type: string}
              rule_name: {type: [string, 'null']}
              attack_type: {type: [string, 'null']}
              count: {type: integer}
        heatmap:
          type: array
          description: 7 ngày gần nhất (cũ trước, tính cả hôm nay) theo múi giờ `DASHBOARD_TZ`.
          items:
            type: object
            required: [date, weekday, hours]
            properties:
              date: {type: string, format: date}
              weekday: {type: integer, minimum: 0, maximum: 6, description: 0 = thứ Hai}
              hours:
                type: array
                minItems: 24
                maxItems: 24
                items: {type: integer}
        top_ips:
          type: array
          maxItems: 5
          items:
            type: object
            required: [ip, count]
            properties:
              ip: {type: string}
              count: {type: integer}
              main_type: {type: [string, 'null'], description: Loại tấn công nhiều nhất của IP}
              trend: {$ref: '#/components/schemas/Trend'}
        persisted:
          type: boolean
    GatewayError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
  parameters:
    Hours:
      name: hours
      in: query
      required: false
      description: Độ dài cửa sổ thời gian (giờ gần nhất).
      schema:
        type: integer
        minimum: 1
        maximum: 720
        default: 24
  responses:
    Unauthorized:
      description: Thiếu hoặc sai token (khi gọi qua gateway).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
