# WAF Log Analyzer: cài bởi scripts/server-up.sh vào /etc/nginx/conf.d/ (ngữ cảnh http).
# Định dạng log giống web demo (infra/web-nginx/conf.d/sites.conf): combined + các trường mở rộng ở cuối
#   "$host"  rt=<request_time giây>  sid="<cookie sessionid>"
# $remote_addr là IP thật của client nhờ waf-cloudflare-realip.conf.
log_format waf_combined '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                        '"$host" rt=$request_time sid="$cookie_sessionid"';

# Header Connection cho WebSocket (giao diện Mailpit cập nhật realtime).
map $http_upgrade $waf_connection_upgrade {
    default upgrade;
    ''      close;
}

# Cloudflare gửi X-Forwarded-Proto: https; truy cập thẳng thì dùng scheme của kết nối.
map $http_x_forwarded_proto $waf_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
