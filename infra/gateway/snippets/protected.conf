# Route cần JWT. Location gọi phải `set $upstream ...` trước khi include.
# Gateway bỏ tiền tố /api rồi chuyển tiếp: /api/scope/check -> <upstream>/scope/check
limit_req zone=api_rl burst=40 nodelay;

auth_request /_auth;
auth_request_set $auth_subject $upstream_http_x_auth_subject;
auth_request_set $auth_roles   $upstream_http_x_auth_roles;

include /etc/nginx/snippets/proxy.conf;
# Ghi đè giá trị client tự gửi: service phía sau chỉ tin header do gateway đặt.
proxy_set_header X-Auth-Subject $auth_subject;
proxy_set_header X-Auth-Roles   $auth_roles;

# Bỏ tiền tố /api và cắt dấu "/" thừa ở cuối (vd /api/alerts/ -> /alerts) để
# service phía sau không phải xử lý redirect trailing-slash.
rewrite ^/api/(.*?)/?$ /$1 break;
proxy_pass $upstream;
