# Mock cho P1 Scope Service và P2 Auth, bám theo contracts/openapi/{scope,auth}.yaml.
# Chỉ dùng khi phát triển: /auth/verify chấp nhận MỌI token (header hoặc cookie), không kiểm tra chữ ký.
# Thay bằng service thật: đổi SCOPE_SERVICE_URL / AUTH_SERVICE_URL trong .env.

# Đối tượng cần kiểm tra: ưu tiên ?domain=, nếu trống thì dùng ?app=
map $arg_domain $scope_target {
    ""      $arg_app;
    default $arg_domain;
}

map $arg_domain $scope_target_type {
    ""      "app";
    default "domain";
}

# Chỉ nhận hostname / tên ứng dụng hợp lệ để có thể echo an toàn vào JSON.
map $scope_target $scope_target_valid {
    "~^[A-Za-z0-9](?:[A-Za-z0-9._-]{0,251}[A-Za-z0-9])?$" 1;
    default 0;
}

map $scope_target $scope_allowed {
    hostnames;
    default 0;
    include /etc/nginx/mock/scope-allowlist.map;
}

# Có token nếu có header "Authorization: Bearer ..." hoặc cookie waf_token.
map $http_authorization $mock_bearer_present {
    "~^Bearer\s+\S+$" 1;
    default           0;
}

map $cookie_waf_token $mock_cookie_present {
    ""      0;
    default 1;
}

map "$mock_bearer_present$mock_cookie_present" $mock_credentials_present {
    "00"    0;
    default 1;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    default_type application/json;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- P1: GET /scope/check?domain=<host> | ?app=<name> ----
    location = /scope/check {
        if ($request_method != GET) {
            return 405 '{"error":"method_not_allowed","message":"use GET"}';
        }
        if ($scope_target_valid = 0) {
            return 400 '{"error":"invalid_request","message":"query parameter domain or app is required and must be a valid name"}';
        }
        if ($scope_allowed) {
            return 200 '{"target":"$scope_target","target_type":"$scope_target_type","allowed":true,"reason":"in scope allowlist (mock)","cache_ttl_seconds":60}';
        }
        return 200 '{"target":"$scope_target","target_type":"$scope_target_type","allowed":false,"reason":"not in scope allowlist (mock)","cache_ttl_seconds":60}';
    }

    # ---- P2: POST /auth/token ----
    # Token tĩnh: header {"alg":"HS256","typ":"JWT"}, payload {"sub":"mock-user","roles":["admin"],"iss":"waf-mock"}
    location = /auth/token {
        if ($request_method != POST) {
            return 405 '{"error":"method_not_allowed","message":"use POST"}';
        }
        add_header Set-Cookie "waf_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJtb2NrLXVzZXIiLCJyb2xlcyI6WyJhZG1pbiJdLCJpc3MiOiJ3YWYtbW9jayJ9.bW9jay1zaWduYXR1cmU; Path=/; HttpOnly; SameSite=Strict; Max-Age=3600";
        return 200 '{"access_token":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJtb2NrLXVzZXIiLCJyb2xlcyI6WyJhZG1pbiJdLCJpc3MiOiJ3YWYtbW9jayJ9.bW9jay1zaWduYXR1cmU","token_type":"Bearer","expires_in":3600}';
    }

    # ---- P2: GET /auth/verify (gateway gọi qua auth_request) ----
    location = /auth/verify {
        if ($mock_credentials_present = 0) {
            add_header WWW-Authenticate 'Bearer realm="waf"' always;
            return 401 '{"error":"unauthorized","message":"missing bearer token or waf_token cookie"}';
        }
        add_header X-Auth-Subject "mock-user";
        add_header X-Auth-Roles "admin";
        return 200 '{"sub":"mock-user","roles":["admin"]}';
    }

    location / {
        return 404 '{"error":"not_found","message":"endpoint is not mocked"}';
    }
}
