# WAF Log Analyzer — hạ tầng chạy toàn hệ thống trên máy cá nhân.
# Hướng dẫn: docs/infrastructure.md. Khởi động nhanh: `make up`.
name: waf-log-analyzer

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Biến môi trường dùng chung cho các service Python (C1–C3, P1–P5).
# EVENT_BUS_URL = bootstrap servers của Kafka (listener nội bộ của network backend).
x-app-env: &app-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  EVENT_BUS_URL: kafka:19092
  DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-waf}
  SCOPE_SERVICE_URL: ${SCOPE_SERVICE_URL:-http://mock-api}
  AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://mock-api}
  HTTP_PORT: "8000"

x-app: &app
  restart: unless-stopped
  logging: *logging
  networks: [backend]
  depends_on:
    kafka-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy

# Detector Java (services/detector). Ngưỡng chấm điểm: xem services/detector/README.md
x-detector-env: &detector-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  SCOPE_SERVICE_URL: ${SCOPE_SERVICE_URL:-http://mock-api}
  ALERT_SCORE_THRESHOLD: ${ALERT_SCORE_THRESHOLD:-70}
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"

x-detector: &detector
  build: ./services/detector
  image: waf/detector:dev
  restart: unless-stopped
  logging: *logging
  networks: [backend]
  environment: *detector-env
  depends_on:
    kafka-init:
      condition: service_completed_successfully

x-nginx-healthcheck: &nginx-healthcheck
  test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
  interval: 10s
  timeout: 3s
  retries: 3

services:
  # ─────────────── Web server mục tiêu (hệ thống bị giám sát) ───────────────
  # Không thuộc analyzer: chỉ chia sẻ log qua volume, nằm ở network riêng.
  web-nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    logging: *logging
    networks: [target]
    ports:
      - "127.0.0.1:${WEB_NGINX_PORT:-8081}:80"
    volumes:
      - ./infra/web-nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/web-nginx/html:/usr/share/nginx/html:ro
      - nginx-logs:/var/log/waf/nginx
    healthcheck: *nginx-healthcheck

  web-apache:
    profiles: [apache]
    build: ./infra/web-apache
    image: waf/web-apache:dev
    restart: unless-stopped
    logging: *logging
    networks: [target]
    ports:
      - "127.0.0.1:${WEB_APACHE_PORT:-8082}:80"
    volumes:
      - apache-logs:/var/log/waf/apache
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ─────────────── Hạ tầng dùng chung ───────────────
  # Event bus Kafka (KRaft, một node). Listener nội bộ kafka:19092 cho service trong network
  # backend; listener 127.0.0.1:9092 cho công cụ trên máy host. Topic: infra/kafka/create-topics.sh
  kafka-volume-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    user: "0:0"
    restart: "no"
    networks: [backend]
    entrypoint: ["/bin/sh", "-ec", "mkdir -p /var/lib/kafka/data && chown -R 1000:1000 /var/lib/kafka/data"]
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    hostname: kafka
    restart: unless-stopped
    logging: *logging
    networks: [backend]
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    restart: "no"
    networks: [backend]
    entrypoint: ["/bin/bash", "/opt/waf/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    volumes:
      - ./infra/kafka/create-topics.sh:/opt/waf/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy

  # Xem message trong topic khi phát triển (profile tools): http://localhost:8085
  kafka-ui:
    profiles: [tools]
    image: ${KAFKA_UI_IMAGE:-ghcr.io/kafbat/kafka-ui:v1.4.2}
    restart: unless-stopped
    logging: *logging
    networks: [backend]
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: waf-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    networks: [backend]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-waf}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  # Cổng vào duy nhất cho API nội bộ: định tuyến + xác thực JWT qua P2 (auth_request).
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    logging: *logging
    networks: [backend]
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
    environment:
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://mock-api}
      SCOPE_SERVICE_URL: ${SCOPE_SERVICE_URL:-http://mock-api}
      RULES_SERVICE_URL: ${RULES_SERVICE_URL:-http://rule-api:8090}
      PIPELINE_SERVICE_URL: ${PIPELINE_SERVICE_URL:-http://p3-orchestrator:8000}
      ALERTING_SERVICE_URL: ${ALERTING_SERVICE_URL:-http://p4-alerting:8000}
      DASHBOARD_SERVICE_URL: ${DASHBOARD_SERVICE_URL:-http://p5-dashboard:8000}
    volumes:
      - ./infra/gateway/templates:/etc/nginx/templates:ro
      - ./infra/gateway/snippets:/etc/nginx/snippets:ro
    healthcheck: *nginx-healthcheck

  # SMTP giả lập cho P4 Alerting; xem email tại http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    logging: *logging
    networks: [backend]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  # ─────────────── Mock (profile: mock) ───────────────
  # Mock P1 Scope + P2 Auth theo contracts/openapi. Sửa allowlist: infra/mock-api/scope-allowlist.map
  mock-api:
    profiles: [mock]
    image: nginx:1.28-alpine
    restart: unless-stopped
    logging: *logging
    networks: [backend]
    ports:
      - "127.0.0.1:${MOCK_API_PORT:-4010}:80"
    volumes:
      - ./infra/mock-api/conf.d:/etc/nginx/conf.d:ro
      - ./infra/mock-api:/etc/nginx/mock:ro
    healthcheck: *nginx-healthcheck

  # Nhận webhook cảnh báo từ P4 và in toàn bộ request ra log: `make logs s=webhook-sink`
  webhook-sink:
    profiles: [mock]
    image: mendhak/http-https-echo:37
    restart: unless-stopped
    logging: *logging
    networks: [backend]
    environment:
      HTTP_PORT: "8080"
      HTTPS_PORT: "8443"
    ports:
      - "127.0.0.1:${WEBHOOK_SINK_PORT:-4020}:8080"

  # ─────────────── Tài liệu (profile: docs) ───────────────
  swagger-ui:
    profiles: [docs]
    image: swaggerapi/swagger-ui:v5.27.1
    restart: unless-stopped
    logging: *logging
    networks: [backend]
    environment:
      URLS: '[{"url":"contracts/scope.yaml","name":"P1 Scope Service"},{"url":"contracts/auth.yaml","name":"P2 Auth"}]'
    ports:
      - "127.0.0.1:${SWAGGER_UI_PORT:-8090}:8080"
    volumes:
      - ./contracts/openapi:/usr/share/nginx/html/contracts:ro

  # ─────────────── Service ứng dụng ───────────────
  # Mỗi service build từ services/<tên>/Dockerfile. Chỉ bật profile khi Dockerfile đã tồn tại.
  # Quy ước (cổng, healthcheck, queue): services/README.md

  # Người 1 — Log Collection
  c1-ingestion:
    <<: *app
    profiles: [c1, collection, app]
    build:
      context: ./services
      dockerfile: c1-ingestion/Dockerfile
    image: waf/c1-ingestion:dev
    environment:
      <<: *app-env
      LOG_DIR: /var/log/waf
    volumes:
      - nginx-logs:/var/log/waf/nginx:ro
      - apache-logs:/var/log/waf/apache:ro

  c2-parser:
    <<: *app
    profiles: [c2, collection, app]
    build:
      context: ./services
      dockerfile: c2-parser/Dockerfile
    image: waf/c2-parser:dev
    environment:
      <<: *app-env

  c3-enrichment:
    <<: *app
    profiles: [c3, collection, app]
    build:
      context: ./services
      dockerfile: c3-enrichment/Dockerfile
    image: waf/c3-enrichment:dev
    environment:
      <<: *app-env
      GEOIP_DB_PATH: /data/geoip/dbip-city-lite.mmdb
    volumes:
      - ./data/geoip:/data/geoip:ro

  # Người 2 — Detection Engine (Java, services/detector): một image, nhiều role.
  #   detector      D1 khớp rule + D3 chấm điểm: log.enriched -> attack.detected / anomaly.scored / alert.triggered
  #   rule-api      D2 quản lý rule (CRUD, kiểm tra RE2), phát snapshot lên topic rules.changed
  #   repartitioner + ddos-detector (profile ddos): phát hiện DDoS theo domain
  detector:
    <<: *detector
    profiles: [detection, app]
    command: ["java", "-jar", "/app/app.jar", "detection"]

  rule-api:
    <<: *detector
    profiles: [detection, app]
    command: ["java", "-jar", "/app/app.jar", "rule-management"]
    environment:
      <<: *detector-env
      RULE_API_PORT: "8090"
      RULE_STORE_PATH: /data/rules.json
    volumes:
      - rules-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  repartitioner:
    <<: *detector
    profiles: [ddos]
    command: ["java", "-jar", "/app/app.jar", "repartition"]

  ddos-detector:
    <<: *detector
    profiles: [ddos]
    command: ["java", "-jar", "/app/app.jar", "ddos"]

  # Người 3 — Platform
  p1-scope:
    <<: *app
    profiles: [p1, platform, app]
    build:
      context: ./services
      dockerfile: p1-scope/Dockerfile
    image: waf/p1-scope:dev
    environment:
      <<: *app-env
      SCOPE_ALLOWLIST: ${SCOPE_ALLOWLIST:-shop.local,blog.local,shop-app}

  p2-auth:
    <<: *app
    profiles: [p2, platform, app]
    build:
      context: ./services
      dockerfile: p2-auth/Dockerfile
    image: waf/p2-auth:dev
    environment:
      <<: *app-env
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}

  p3-orchestrator:
    <<: *app
    profiles: [p3, platform, app]
    build:
      context: ./services
      dockerfile: p3-orchestrator/Dockerfile
    image: waf/p3-orchestrator:dev
    environment:
      <<: *app-env
      PIPELINES_DIR: /config/pipelines
    volumes:
      - ./config/pipelines:/config/pipelines:ro

  p4-alerting:
    <<: *app
    profiles: [p4, platform, app]
    build:
      context: ./services
      dockerfile: p4-alerting/Dockerfile
    image: waf/p4-alerting:dev
    environment:
      <<: *app-env
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      ALERT_EMAIL_FROM: waf-alerts@waf.local
      ALERT_EMAIL_TO: soc@waf.local
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://webhook-sink:8080/alerts}

  p5-dashboard:
    <<: *app
    profiles: [p5, platform, app]
    build:
      context: ./services
      dockerfile: p5-dashboard/Dockerfile
    image: waf/p5-dashboard:dev
    environment:
      <<: *app-env

  # Quan sát: tổng hợp metric từ event bus cho Prometheus (profile obs).
  metrics-exporter:
    <<: *app
    profiles: [obs]
    build:
      context: ./services
      dockerfile: metrics-exporter/Dockerfile
    image: waf/metrics-exporter:dev
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:${METRICS_PORT:-9101}:8000"

networks:
  backend:
  target:

volumes:
  nginx-logs:
  apache-logs:
  kafka-data:
  rules-data:
  postgres-data:
