# Web server mục tiêu Apache (profile: apache).
# Định dạng = combined + trường mở rộng. Khác Nginx: thời gian xử lý tính bằng micro giây (rt_us).
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" \"%{Host}i\" rt_us=%D sid=\"%{sessionid}C\"" waf_combined

ServerName blog.local
ServerTokens Prod

<VirtualHost *:80>
    ServerName blog.local
    DocumentRoot "/usr/local/apache2/htdocs"

    # Không ghi log cho healthcheck nội bộ của container
    SetEnvIf Remote_Addr "^127\.0\.0\.1$" dontlog

    CustomLog "/var/log/waf/apache/blog.local.access.log" waf_combined env=!dontlog
    CustomLog "/proc/self/fd/1" waf_combined env=!dontlog
    ErrorLog  "/var/log/waf/apache/blog.local.error.log"
</VirtualHost>
