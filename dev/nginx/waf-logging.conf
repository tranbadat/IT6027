# Include một lần trong http { } của nginx.conf (không phải trong server {}).
# Định dạng "waf" = combined + rt= (thời gian xử lý) + ck= (CHỈ cookie phiên, không phải toàn bộ Cookie header).
#
# Đổi $cookie_PHPSESSID thành tên cookie phiên thật của website (ví dụ:
#   Node/Express (connect.sid) -> $cookie_connect_sid   (Nginx đổi "." và "-" trong tên cookie thành "_")
#   Java (JSESSIONID)          -> $cookie_JSESSIONID
#   Laravel                    -> $cookie_laravel_session
#   Django                     -> $cookie_sessionid
# Không dùng $http_cookie: nó log toàn bộ Cookie header, lộ mọi token của người dùng.

log_format waf '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
               '"$http_referer" "$http_user_agent" rt=$request_time ck="$cookie_PHPSESSID"';
