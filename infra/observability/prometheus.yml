# Prometheus scrape config cho WAF Log Analyzer.
global:
  scrape_interval: 10s
  scrape_timeout: 5s

scrape_configs:
  # Số liệu nghiệp vụ/bảo mật từ event bus (do metrics-exporter tổng hợp).
  - job_name: waf-metrics-exporter
    static_configs:
      - targets: ["metrics-exporter:8000"]

  # Số liệu hạ tầng RabbitMQ (queue depth, message rate) từ plugin rabbitmq_prometheus.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
