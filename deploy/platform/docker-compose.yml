# LOẠI 3 — Platform / Hub trung tâm (Người 3): quản trị & kết quả sau xử lý.
# Gồm backbone dùng chung (Kafka + Postgres) + P1..P5 + gateway.
# Dựng 1 lần cho cả hệ thống. Pipeline (Loại 2) và Sensor (Loại 1) trỏ về đây.
#
# Chạy:  docker network create waf-net   (một lần, hoặc `make net` ở gốc repo)
#        cp .env.example .env  &&  chỉnh secret
#        docker compose up -d --wait
name: waf-platform

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-svc-env: &svc-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  EVENT_BUS_URL: kafka:19092
  DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-waf}
  SCOPE_SERVICE_URL: http://p1-scope:8000
  AUTH_SERVICE_URL: http://p2-auth:8000
  HTTP_PORT: "8000"

x-svc: &svc
  restart: unless-stopped
  logging: *logging
  networks: [waf-net]
  depends_on:
    kafka-init: { condition: service_completed_successfully }
    postgres: { condition: service_healthy }

x-nginx-healthcheck: &nginx-healthcheck
  test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
  interval: 10s
  timeout: 3s
  retries: 3

services:
  # Event bus Kafka (KRaft, một node). Stack khác trên cùng máy nối qua waf-net: kafka:19092.
  # Máy khác nối qua listener EXTERNAL (${KAFKA_EXTERNAL_HOST}:${KAFKA_EXTERNAL_PORT}), mặc định chỉ
  # bind 127.0.0.1 vì PLAINTEXT không có xác thực — mở ra mạng ngoài phải có firewall hoặc SASL/TLS.
  kafka-volume-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    user: "0:0"
    restart: "no"
    networks: [waf-net]
    entrypoint: ["/bin/sh", "-ec", "mkdir -p /var/lib/kafka/data && chown -R 1000:1000 /var/lib/kafka/data"]
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    hostname: kafka
    restart: unless-stopped
    logging: *logging
    networks: [waf-net]
    ports:
      - "${KAFKA_EXTERNAL_BIND:-127.0.0.1}:${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      kafka-volume-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    restart: "no"
    networks: [waf-net]
    entrypoint: ["/bin/bash", "/opt/waf/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    volumes:
      - ../../infra/kafka/create-topics.sh:/opt/waf/create-topics.sh:ro
    depends_on:
      kafka: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    networks: [waf-net]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-waf}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    logging: *logging
    networks: [waf-net]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  p1-scope:
    <<: *svc
    image: waf/p1-scope:dev
    environment:
      <<: *svc-env
      SCOPE_ALLOWLIST: ${SCOPE_ALLOWLIST:-shop.local,blog.local,shop-app}

  p2-auth:
    <<: *svc
    image: waf/p2-auth:dev
    environment:
      <<: *svc-env
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}

  p3-orchestrator:
    <<: *svc
    image: waf/p3-orchestrator:dev
    environment:
      <<: *svc-env
      PIPELINES_DIR: /config/pipelines
    volumes:
      - ../../config/pipelines:/config/pipelines:ro

  p4-alerting:
    <<: *svc
    image: waf/p4-alerting:dev
    environment:
      <<: *svc-env
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      ALERT_EMAIL_FROM: waf-alerts@waf.local
      ALERT_EMAIL_TO: soc@waf.local
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://webhook-sink:8080/alerts}

  p5-dashboard:
    <<: *svc
    image: waf/p5-dashboard:dev
    environment:
      <<: *svc-env

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    logging: *logging
    networks: [waf-net]
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    environment:
      AUTH_SERVICE_URL: http://p2-auth:8000
      SCOPE_SERVICE_URL: http://p1-scope:8000
      RULES_SERVICE_URL: ${RULES_SERVICE_URL:-http://rule-api:8090}   # Rule API của detector, ở stack Pipeline
      PIPELINE_SERVICE_URL: http://p3-orchestrator:8000
      ALERTING_SERVICE_URL: http://p4-alerting:8000
      DASHBOARD_SERVICE_URL: http://p5-dashboard:8000
    volumes:
      - ../../infra/gateway/templates:/etc/nginx/templates:ro
      - ../../infra/gateway/snippets:/etc/nginx/snippets:ro
    healthcheck: *nginx-healthcheck

  # Nhận webhook cảnh báo khi demo (profile dev).
  webhook-sink:
    profiles: [dev]
    image: mendhak/http-https-echo:37
    restart: unless-stopped
    logging: *logging
    networks: [waf-net]
    environment:
      HTTP_PORT: "8080"
      HTTPS_PORT: "8443"
    ports:
      - "127.0.0.1:${WEBHOOK_SINK_PORT:-4020}:8080"

  # Xem OpenAPI (profile docs).
  swagger-ui:
    profiles: [docs]
    image: swaggerapi/swagger-ui:v5.27.1
    restart: unless-stopped
    logging: *logging
    networks: [waf-net]
    environment:
      URLS: '[{"url":"contracts/scope.yaml","name":"P1 Scope Service"},{"url":"contracts/auth.yaml","name":"P2 Auth"}]'
    ports:
      - "127.0.0.1:${SWAGGER_UI_PORT:-8090}:8080"
    volumes:
      - ../../contracts/openapi:/usr/share/nginx/html/contracts:ro

networks:
  waf-net:
    external: true
    name: waf-net

volumes:
  kafka-data:
  postgres-data:
