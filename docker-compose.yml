x-detector-environment: &detector-environment
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
  KAFKA_INPUT_TOPIC: ${KAFKA_INPUT_TOPIC:-web.requests.v1}
  KAFKA_DOMAIN_TOPIC: ${KAFKA_DOMAIN_TOPIC:-web.requests.by-domain.v1}
  ATTACK_DETECTED_TOPIC: ${ATTACK_DETECTED_TOPIC:-attack.detected.v1}
  ANOMALY_SCORED_TOPIC: ${ANOMALY_SCORED_TOPIC:-anomaly.scored.v1}
  ALERT_TRIGGERED_TOPIC: ${ALERT_TRIGGERED_TOPIC:-alert.triggered.v1}
  RULE_CHANGES_TOPIC: ${RULE_CHANGES_TOPIC:-rules.changed.v1}
  KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-security.invalid.v1}
  BATCH_SIZE: ${BATCH_SIZE:-200}
  REQUEST_WINDOW_SECONDS: ${REQUEST_WINDOW_SECONDS:-60}
  REQUEST_THRESHOLD: ${REQUEST_THRESHOLD:-20}
  ERROR_THRESHOLD: ${ERROR_THRESHOLD:-8}
  DISTINCT_PATH_THRESHOLD: ${DISTINCT_PATH_THRESHOLD:-12}
  ALERT_SCORE_THRESHOLD: ${ALERT_SCORE_THRESHOLD:-70}
  RULE_ALERT_COOLDOWN_SECONDS: ${RULE_ALERT_COOLDOWN_SECONDS:-15}
  DDOS_WINDOW_SECONDS: ${DDOS_WINDOW_SECONDS:-10}
  DDOS_REQUESTS_THRESHOLD: ${DDOS_REQUESTS_THRESHOLD:-300}
  DDOS_UNIQUE_IPS_THRESHOLD: ${DDOS_UNIQUE_IPS_THRESHOLD:-20}
  DDOS_COOLDOWN_SECONDS: ${DDOS_COOLDOWN_SECONDS:-10}
  MAX_FUTURE_SKEW_SECONDS: ${MAX_FUTURE_SKEW_SECONDS:-300}
  MAX_TRACKED_CLIENTS: ${MAX_TRACKED_CLIENTS:-100000}
  MAX_TRACKED_DOMAINS: ${MAX_TRACKED_DOMAINS:-10000}
  EMIT_ONLY_ALERTS: ${EMIT_ONLY_ALERTS:-false}

x-detector-service: &detector-service
  image: waf-log-detector:${DETECTOR_IMAGE_TAG:-local}
  build:
    context: .
  restart: unless-stopped
  depends_on:
    kafka-init:
      condition: service_completed_successfully

services:
  kafka-volume-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    user: 0:0
    restart: no
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        mkdir -p /tmp/kraft-combined-logs
        chown -R 1000:1000 /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092},PLAINTEXT://kafka:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/19092' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic ${KAFKA_INPUT_TOPIC:-web.requests.v1} --partitions ${KAFKA_INPUT_PARTITIONS:-6} --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic ${KAFKA_DOMAIN_TOPIC:-web.requests.by-domain.v1} --partitions ${KAFKA_DOMAIN_PARTITIONS:-6} --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic ${ATTACK_DETECTED_TOPIC:-attack.detected.v1} --partitions ${KAFKA_OUTPUT_PARTITIONS:-6} --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic ${ANOMALY_SCORED_TOPIC:-anomaly.scored.v1} --partitions ${KAFKA_OUTPUT_PARTITIONS:-6} --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic ${ALERT_TRIGGERED_TOPIC:-alert.triggered.v1} --partitions ${KAFKA_OUTPUT_PARTITIONS:-6} --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic ${RULE_CHANGES_TOPIC:-rules.changed.v1} --partitions 1 --replication-factor 1 --config cleanup.policy=compact
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic ${KAFKA_DLQ_TOPIC:-security.invalid.v1} --partitions ${KAFKA_DLQ_PARTITIONS:-3} --replication-factor 1

  kafka-ui:
    image: ${KAFKA_UI_IMAGE:-ghcr.io/kafbat/kafka-ui:v1.4.2}
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_UI_CLUSTER_NAME:-waf-local}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "false"
      AUTH_TYPE: DISABLED

  detector:
    <<: *detector-service
    command: ["java", "-jar", "/app/app.jar", "detection"]
    environment:
      <<: *detector-environment
      BATCH_SIZE: ${RULE_BATCH_SIZE:-200}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-waf-detector-v2}

  rules-volume-init:
    image: waf-log-detector:${DETECTOR_IMAGE_TAG:-local}
    user: 0:0
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["mkdir -p /data && chown -R 10001:10001 /data"]
    volumes:
      - rules-data:/data

  rule-api:
    <<: *detector-service
    command: ["java", "-jar", "/app/app.jar", "rule-management"]
    ports:
      - "${RULE_API_PORT:-8090}:8090"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      rules-volume-init:
        condition: service_completed_successfully
    environment:
      <<: *detector-environment
      RULE_API_PORT: 8090
      RULE_STORE_PATH: /data/rules.json
    volumes:
      - rules-data:/data

  repartitioner:
    <<: *detector-service
    command: ["java", "-jar", "/app/app.jar", "repartition"]
    environment:
      <<: *detector-environment
      BATCH_SIZE: ${REPARTITION_BATCH_SIZE:-500}
      KAFKA_REPARTITION_GROUP: ${KAFKA_REPARTITION_GROUP:-waf-repartition-v2}

  ddos-detector:
    <<: *detector-service
    command: ["java", "-jar", "/app/app.jar", "ddos"]
    environment:
      <<: *detector-environment
      BATCH_SIZE: ${DDOS_BATCH_SIZE:-500}
      KAFKA_DDOS_GROUP: ${KAFKA_DDOS_GROUP:-waf-ddos-v2}

  simulator:
    profiles: ["simulation"]
    image: waf-log-simulator:${SIMULATOR_IMAGE_TAG:-local}
    build:
      context: ../log-simulator
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      KAFKA_INPUT_TOPIC: ${KAFKA_INPUT_TOPIC:-web.requests.v1}
    command:
      - java
      - -jar
      - /app/app.jar
      - --rate
      - ${SIM_RATE:-20}
      - --duration
      - ${SIM_DURATION:-120}
      - --mode
      - ${SIM_MODE:-mixed}
      - --seed
      - ${SIM_SEED:-42}

volumes:
  kafka-data:
  rules-data:
